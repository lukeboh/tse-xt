<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>TSE XT</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0077ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>TSE XT</span>
      </div>
      <span class="version-tag" id="popupVersion">v0.0.0</span>
    </div>

    <div class="popup-section">
      <label class="section-label">Preenchimento dos cards de KPI</label>
      <div class="segmented-control" data-setting="kpiCardStyle">
        <button type="button" class="segment-btn" data-value="flat">Clássico</button>
        <button type="button" class="segment-btn" data-value="gradient">Gradiente</button>
      </div>
      <p class="section-hint">Vidro translúcido, como hoje, ou degradê azul&nbsp;→&nbsp;ciano da identidade visual.</p>
    </div>

    <div class="popup-section">
      <label class="section-label">Destaque dos cards de KPI</label>
      <div class="segmented-control" data-setting="kpiCardEmphasis">
        <button type="button" class="segment-btn" data-value="soft">Suave</button>
        <button type="button" class="segment-btn" data-value="glow">Glow azul</button>
      </div>
      <p class="section-hint">Sombra tátil discreta ou brilho azul mais profundo, sempre visível.</p>
    </div>

    <div class="popup-footer">
      <button id="btnReload" class="btn-primary">Atualizar página do portal</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
